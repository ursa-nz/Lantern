name: Build & Release AppImage

# Forgejo Actions port of .github/workflows/build-appimage.yml, x86_64 only —
# Forgejo's runners here are x86_64, so the aarch64 AppImage is built on GitHub's
# native ARM runner instead. The base is Ubuntu 24.04 (catthehacker's act image),
# the oldest with webkitgtk-6.0, which sets the image's glibc floor.
#
# On a pushed version tag this builds the AppImage and creates a Forgejo release
# with it attached. Manual dispatch uploads a workflow artifact only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write           # needed to create the release

concurrency:
  group: build-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    # --privileged lets linuxdeploy/appimagetool do their thing; the build
    # script also forces APPIMAGE_EXTRACT_AND_RUN so they don't need /dev/fuse.
    container:
      image: catthehacker/ubuntu:act-24.04
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (to fetch marp-cli at build time)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the GTK/WebKit stack and packaging tools
        # gir1.2-* pull the matching runtime libs (libgtk-4-1, libadwaita-1-0,
        # libgtksourceview-5-0, libwebkitgtk-6.0-4 + helpers). The *-bin packages
        # provide the gtk-update-icon-cache / gdk-pixbuf-query-loaders /
        # glib-compile-schemas tools the gtk plugin calls; librsvg2-common is the
        # SVG pixbuf loader for the icon. The gtk plugin resolves the GTK module
        # dir via `pkg-config gtk4`, so it needs gtk4.pc from libgtk-4-dev. Run
        # as root — no sudo.
        run: |
          apt-get update
          apt-get install -y \
            python3 python3-gi pkg-config libgtk-4-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5 gir1.2-webkit-6.0 \
            libglib2.0-bin libgtk-3-bin librsvg2-common \
            pandoc desktop-file-utils file
          apt-get install -y libgdk-pixbuf2.0-bin \
            || apt-get install -y libgdk-pixbuf-2.0-bin

      - name: Build AppImage
        # The build fetches linuxdeploy/appimagetool from github.com at run time,
        # so a transient download hiccup can fail an otherwise-good build (it has
        # flaked here while the same commit built green on GitHub). Retry a few
        # times before giving up — the script re-creates AppDir on each run, so a
        # retry starts clean.
        run: |
          version=""
          case "${GITHUB_REF}" in refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;; esac
          n=0
          until ./scripts/build-appimage.sh "${version}"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "AppImage build failed after $n attempts" >&2; exit 1; fi
            echo "AppImage build attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done

      - name: Upload as workflow artifact
        # v3 for the same Forgejo runner reason as the other workflows.
        uses: actions/upload-artifact@v3
        with:
          name: Lantern-x86_64.AppImage
          path: build/Lantern-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Stage release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp build/Lantern-x86_64.AppImage dist/

      - name: Create Forgejo release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          release-dir: dist
          token: ${{ secrets.GITHUB_TOKEN }}
