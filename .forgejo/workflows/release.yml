name: Build & Release

# Single gated Forgejo pipeline: build the deb, AppImage and Flatpak in parallel
# jobs, then ONE release job (needs: all three) creates the Forgejo release and
# attaches every asset at once.
#
# Why this is one workflow when GitHub uses three: forgejo-release creates the
# release (POST .../releases) and errors "There already is a release for this
# tag" if it already exists — and its `override` deletes+recreates, so three
# concurrent workflows can't share one release without racing/clobbering. GitHub
# gets away with three separate workflows because softprops/action-gh-release
# upserts. So on Forgejo the release must be created exactly once, after all the
# builds finish — which is what the `release` job's `needs:` gate guarantees.
#
# On a pushed version tag (v1.2.3, etc.) the release job publishes; manual
# dispatch builds and uploads workflow artifacts only. The .deb is
# Architecture: all, so one x86_64 build serves amd64 and arm64.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write           # needed to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Build deb package
    runs-on: ubuntu-latest
    # catthehacker's act image is Ubuntu 24.04 with node + apt; we run as root,
    # so no sudo. dpkg-dev provides dpkg-deb.
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (to fetch marp-cli at build time)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dpkg tooling
        run: |
          apt-get update
          apt-get install -y dpkg-dev

      - name: Build deb
        run: |
          version=""
          case "${GITHUB_REF}" in refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;; esac
          ./scripts/build-deb.sh "${version}"

      - name: Upload as workflow artifact
        # Forgejo's runner doesn't support the v2 artifact backend that
        # upload-artifact@v4 needs (it reports as GHES); v3 uses the older
        # protocol that works here.
        uses: actions/upload-artifact@v3
        with:
          name: lantern-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 30

  appimage:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    # --privileged lets linuxdeploy/appimagetool do their thing; the build
    # script also forces APPIMAGE_EXTRACT_AND_RUN so they don't need /dev/fuse.
    container:
      image: catthehacker/ubuntu:act-24.04
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (to fetch marp-cli at build time)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the GTK/WebKit stack and packaging tools
        # gir1.2-* pull the matching runtime libs (libgtk-4-1, libadwaita-1-0,
        # libgtksourceview-5-0, libwebkitgtk-6.0-4 + helpers). The *-bin packages
        # provide the gtk-update-icon-cache / gdk-pixbuf-query-loaders /
        # glib-compile-schemas tools the gtk plugin calls; librsvg2-common is the
        # SVG pixbuf loader for the icon. The gtk plugin resolves the GTK module
        # dir via `pkg-config gtk4`, so it needs gtk4.pc from libgtk-4-dev. Run
        # as root — no sudo.
        run: |
          apt-get update
          apt-get install -y \
            python3 python3-gi pkg-config libgtk-4-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5 gir1.2-webkit-6.0 \
            libglib2.0-bin libgtk-3-bin librsvg2-common \
            pandoc desktop-file-utils file
          apt-get install -y libgdk-pixbuf2.0-bin \
            || apt-get install -y libgdk-pixbuf-2.0-bin

      - name: Build AppImage
        # The build fetches linuxdeploy/appimagetool from github.com at run time,
        # so a transient download hiccup can fail an otherwise-good build (it has
        # flaked here while the same commit built green on GitHub). Retry a few
        # times before giving up — the script re-creates AppDir on each run, so a
        # retry starts clean.
        run: |
          version=""
          case "${GITHUB_REF}" in refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;; esac
          n=0
          until ./scripts/build-appimage.sh "${version}"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "AppImage build failed after $n attempts" >&2; exit 1; fi
            echo "AppImage build attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v3
        with:
          name: Lantern-x86_64.AppImage
          path: build/Lantern-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Build flatpak bundle
    runs-on: ubuntu-latest
    # The container must ship node, since checkout/cache/upload-artifact are
    # Node actions the runner executes inside it. --privileged lets
    # flatpak-builder's bwrap create namespaces. The bundle builds against the
    # GNOME 49 SDK regardless of this host's Ubuntu version.
    container:
      image: catthehacker/ubuntu:act-24.04
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          apt-get update
          apt-get install -y flatpak flatpak-builder

      - name: Cache flatpak runtime + SDK
        # GNOME 49 Platform/Sdk plus the node22 extension come to well over a
        # gig; caching the user flatpak dir cuts subsequent builds down sharply.
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-gnome49-node22-v1

      - name: Build bundle
        # Like the AppImage, this pulls the GNOME runtime/SDK from Flathub and
        # runs a heavy build, so a transient network/runner hiccup can sink an
        # otherwise-good build. Retry a few times — the script --force-cleans its
        # build dir on each run, so a retry starts clean.
        run: |
          n=0
          until ./scripts/build-flatpak.sh; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Flatpak build failed after $n attempts" >&2; exit 1; fi
            echo "Flatpak build attempt $n failed; retrying in 10s..." >&2
            sleep 10
          done

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v3
        with:
          name: nz.ursa.Lantern.flatpak
          path: build/nz.ursa.Lantern.flatpak
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [deb, appimage, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # forgejo-release talks to the API with jq + curl (the action installs them
    # if missing); the act image already has node for download-artifact.
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      # Pull each build job's artifact into one dir. download-artifact@v3 with a
      # name extracts that artifact's files straight into `path`, so three steps
      # land all assets side by side in dist/.
      - name: Collect the deb
        uses: actions/download-artifact@v3
        with:
          name: lantern-deb
          path: dist
      - name: Collect the AppImage
        uses: actions/download-artifact@v3
        with:
          name: Lantern-x86_64.AppImage
          path: dist
      - name: Collect the flatpak
        uses: actions/download-artifact@v3
        with:
          name: nz.ursa.Lantern.flatpak
          path: dist

      - name: List assets to publish
        run: ls -l dist

      - name: Create Forgejo release (once, with every asset)
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          release-dir: dist
          token: ${{ secrets.GITHUB_TOKEN }}
