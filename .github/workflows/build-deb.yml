name: Build & Release deb

# Builds the Lantern .deb. The package is Architecture: all — pure Python plus a
# bundled, pure-JS marp-cli, leaning on the distro's own GTK 4 / libadwaita /
# GtkSourceView / WebKitGTK (via PyGObject) and Node — so one build serves amd64
# and arm64. On a pushed version tag (v1.2.3, etc.) it's attached to the release;
# manual dispatch uploads a workflow artifact only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write           # needed to create the release

concurrency:
  group: build-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build deb package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (to fetch marp-cli at build time)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dpkg tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build deb
        run: |
          version=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-deb.sh "${version}"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
