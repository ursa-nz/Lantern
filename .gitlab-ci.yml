#
# Build and release Lantern on Katara's GitLab (lab.ursa.nz).
#
# Two x86_64 docker executors on the box's rootless Podman socket (see katara
# silos/gitlab-runner). Most jobs run on the general `podman` runner, which is
# unprivileged by design. The flatpak build runs on the dedicated `flatpak`
# runner, which is the same rootless setup with one relaxation: it unmasks /proc
# (unmask=all, not privileged, no added capabilities or devices). That shapes
# this pipeline:
#
#   * One arch. The box is x86_64, so the flatpak and the AppImage are built for
#     x86_64 only. There is no native arm64 here and QEMU would need privilege
#     neither runner grants.
#   * No /dev/fuse. The shared template builds with --disable-rofiles-fuse, and
#     build-appimage.sh forces APPIMAGE_EXTRACT_AND_RUN, so appimagetool extracts
#     rather than mounting a FUSE image.
#   * Why the flatpak runner unmasks /proc. flatpak-builder sandboxes each module
#     build with bwrap, which mounts a private /proc. Podman masks /proc in a job
#     container by default, and the kernel then refuses bwrap's fresh proc mount.
#     Unmasking /proc is the minimum that lets the build run without privilege.
#
# The flatpak is the artifact that matters; the AppImage is a best-effort extra,
# so its job is allow_failure and the release links it only when it built.
#
# A pushed version tag (v1.2.3) builds and publishes a release. A manual web
# run builds the same artifacts and uploads them to the generic package
# registry without cutting a release. Failures open an issue on ursa.nz/ops.

# test and deploy are the template's own stages, for its lint and release jobs.
# GitLab validates every included job's stage even when its rules never fire, so
# both have to exist here whether or not they run.
stages: [build, test, deploy, release, report]

variables:
  APP_ID: "nz.ursa.Lantern"
  PACKAGE: "lantern"                       # generic package registry name

# Only ever run for a tag or a manual dispatch; ordinary branch pushes build
# nothing. This mirrors the GitHub workflows' `on: push tags + workflow_dispatch`.
# A manual dispatch is the UI "Run pipeline" button (web) or an API call (api),
# and on a branch it builds the artifacts without cutting a release.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'

# --- Flatpak bundle (the release artifact). ---
# Built by the shared template, on the `flatpak` runner and the signed toolchain
# image, so a fix to the build reaches this app the same way it reaches every
# other one. The template already does what this repo's job used to do by hand:
# the Flathub remote, the state and build dirs on the runner's cache mount, the
# unsandboxed export, the bundle, and the upload to the package registry on a tag.
#
# scripts/build-flatpak.sh stays in the repo. It is what a contributor runs on a
# laptop, and it builds the same manifest.
include:
  - project: ursa.nz/ci-templates
    ref: main
    file: /flatpak-build.yml
    inputs:
      app-id: nz.ursa.Lantern
      manifest: flatpak/nz.ursa.Lantern.yaml

# The template cuts a release carrying the flatpak alone. Lantern ships an
# AppImage beside it, so the release job below links both and this one stands down
# rather than racing it for the same tag.
flatpak-release:
  rules:
    - when: never

appimage-build:
  stage: build
  tags: [podman]
  image: ubuntu:24.04
  allow_failure: true
  retry:
    max: 1
    when: script_failure
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates >/dev/null
    # The AppImage bundles whatever `node` is on PATH; Ubuntu 24.04 ships 18, so
    # pull node 22 from NodeSource to match the flatpak's node22 and the other
    # release pipelines.
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
    - |
      apt-get install -y --no-install-recommends \
        nodejs \
        python3 python3-gi pkg-config libgtk-4-dev dpkg-dev \
        gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5 gir1.2-webkit-6.0 \
        libglib2.0-bin libgtk-3-bin librsvg2-common \
        pandoc desktop-file-utils file >/dev/null
    - apt-get install -y --no-install-recommends libgdk-pixbuf2.0-bin >/dev/null
        || apt-get install -y --no-install-recommends libgdk-pixbuf-2.0-bin >/dev/null
  script:
    - version=""
    - '[ -n "$CI_COMMIT_TAG" ] && version="${CI_COMMIT_TAG#v}"'
    - ./scripts/build-appimage.sh "$version"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "build/Lantern-x86_64.AppImage" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE}/${CI_COMMIT_TAG}/Lantern-x86_64.AppImage"
      fi
  # No job artifact, for the same reason as the flatpak: the AppImage is over the
  # instance's artifact size limit. On a tag it lands in the generic package
  # registry above; a manual run just proves the build.

# --- Cut the release and link the artifacts from the package registry. ---
# needs only the flatpak, so a failed AppImage never holds the release back; the
# AppImage link is added only if that upload actually landed, checked with a HEAD
# against the package registry, so the release carries no dead link. The flatpak
# link is always present because the flatpak job gates this one.
release:
  stage: release
  tags: [podman]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    # Ordering only; the build jobs export no artifacts, and this job links assets
    # from the package registry, so there is nothing to download.
    - job: flatpak-build
      artifacts: false
    - job: appimage-build
      optional: true
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache curl >/dev/null
  script:
    - base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE}/${CI_COMMIT_TAG}"
    # The bundle lands under the shared `flatpak` package name, where the template
    # puts every app's. The AppImage keeps this project's own name, since nothing
    # else ships one.
    - flatpak_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/flatpak/${CI_COMMIT_TAG}/${APP_ID}-x86_64.flatpak"
    - appimage_url="${base}/Lantern-x86_64.AppImage"
    - set -- --assets-link "{\"name\":\"${APP_ID}-x86_64.flatpak\",\"url\":\"${flatpak_url}\",\"link_type\":\"package\"}"
    - |
      if curl --fail --silent --head --header "JOB-TOKEN: $CI_JOB_TOKEN" "$appimage_url" >/dev/null 2>&1; then
        set -- "$@" --assets-link "{\"name\":\"Lantern-x86_64.AppImage\",\"url\":\"${appimage_url}\",\"link_type\":\"package\"}"
      fi
    - |
      release-cli create \
        --tag-name "$CI_COMMIT_TAG" \
        --name "Lantern $CI_COMMIT_TAG" \
        --description "Lantern $CI_COMMIT_TAG. Flatpak bundle for x86_64; AppImage where built. Install the flatpak with: flatpak install --user ./${APP_ID}-x86_64.flatpak" \
        "$@"

# --- Open or update a deduplicated ops issue when the pipeline fails. ---
# The house failure template every ursa.nz pipeline carries (see katara
# docs/notices.md). One open issue per fingerprint on ursa.nz/ops; a recurrence
# is a comment, not a new issue. It prefers a stored OPS_TOKEN (a project access
# token scoped to ursa.nz/ops with the api scope) and falls back to CI_JOB_TOKEN
# where the instance lets a job token write issues. Email is the floor if both
# the API calls fail.
ops-issue-on-failure:
  stage: report
  tags: [podman]
  image: debian:bookworm-slim
  variables:
    OPS_API: "$CI_API_V4_URL"
    OPS_PROJECT: "ursa.nz/ops"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_failure
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl jq ca-certificates >/dev/null
    - |
      token="${OPS_TOKEN:-$CI_JOB_TOKEN}"
      proj="${OPS_PROJECT//\//%2F}"
      fp="ci-${CI_PROJECT_PATH}"
      body="Pipeline ${CI_PIPELINE_ID} failed on ${CI_COMMIT_REF_NAME} (${CI_COMMIT_SHORT_SHA}). ${CI_PIPELINE_URL}"
      iid="$(curl -fsS -H "PRIVATE-TOKEN: $token" -G "$OPS_API/projects/$proj/issues" \
        --data-urlencode "state=opened" --data-urlencode "labels=fp::$fp" 2>/dev/null | jq -r '.[0].iid // empty')"
      if [ -n "$iid" ]; then
        curl -fsS -H "PRIVATE-TOKEN: $token" --request POST "$OPS_API/projects/$proj/issues/$iid/notes" \
          --data-urlencode "body=Recurred. $body" >/dev/null && echo "commented on #$iid" || echo "ops comment failed (email floor stands)"
      else
        curl -fsS -H "PRIVATE-TOKEN: $token" --request POST "$OPS_API/projects/$proj/issues" \
          --data-urlencode "title=[ci] pipeline failed: ${CI_PROJECT_PATH}" \
          --data-urlencode "labels=lantern,ci,fp::$fp,severity::critical" \
          --data-urlencode "description=$body" >/dev/null && echo "opened an ops issue" || echo "ops issue failed (email floor stands)"
      fi
