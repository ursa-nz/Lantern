id: nz.ursa.Lantern
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: lantern

# Sandbox permissions — kept to what software centers rate as "Safe":
# no network, no filesystem access, Wayland-first windowing.
#
# No --share=network: the app and its bundled marp server share a private,
# loopback-only network namespace.  WebKit, marp and the live-reload
# websocket all talk over localhost inside it, and marp's server (which
# binds every interface and has no --host option) is unreachable from the
# LAN — previously documented here as a leak.  What made this look
# impossible before: WebKit resolves proxies through the ProxyResolver
# portal, which rejects apps without network permission
# (org.freedesktop.portal.Error.NotAllowed), failing even loopback loads.
# application.py forces NO_PROXY on the WebKit session, so the lookup
# never happens.  The cost: http(s) image references in a deck no longer
# render — bundle images instead, or restore networking per-install with
# `flatpak override --share=network nz.ursa.Lantern`.
#
# No --filesystem=home: open/save/export use Gtk.FileDialog, which routes
# through the FileChooser portal and grants per-file access via the
# document portal.  State, themes and working dirs live in the app's own
# XDG dirs inside the sandbox, which need no permission.  One degradation:
# importing a loose .md can't see images sitting next to it (the portal
# grants only the picked file); the bundle's add-image flow covers that.
#
# org.freedesktop.portal.Desktop needs no talk-name: flatpak grants
# portal access by default.
finish-args:
  - --share=ipc               # X11 fallback performance (MIT-SHM)
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    npm_config_cache: /run/build/marp-cli/.npm

modules:

  # Marp CLI bundled into /app/bin/marp.
  # We allow network during this build step so npm can fetch from the registry.
  # For a fully reproducible Flathub-style build, swap this for an offline
  # `npm ci` against a pre-generated node-sources.json (flatpak-node-generator).
  - name: marp-cli
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - mkdir -p /app/share/lantern /app/bin
      - cp package.json /app/share/lantern/
      - cd /app/share/lantern && npm install --no-audit --no-fund --omit=dev '@marp-team/marp-cli@^4.1.0'

      # The node22 SDK extension is build-only. marp's shebang is
      # `#!/usr/bin/env node`, so we need node on PATH inside the runtime
      # sandbox too. Copy the SDK's node binary into /app/bin.
      - install -Dm755 /usr/lib/sdk/node22/bin/node /app/bin/node

      - ln -sf /app/share/lantern/node_modules/.bin/marp /app/bin/marp
    sources:
      - type: inline
        dest-filename: package.json
        contents: |
          {
            "name": "lantern-runtime",
            "private": true,
            "version": "1.0.0",
            "description": "Bundled marp-cli for Lantern."
          }

  # pandoc powers PPTX export (Markdown -> native, editable .pptx).  Prebuilt
  # static binaries exist for both arches, so the bundle stays multi-arch with
  # no build step — just drop the right one in for the target.
  - name: pandoc
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/pandoc /app/bin/pandoc
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-linux-amd64.tar.gz
        sha256: a69abfababda8a56969a254b09f9553a7be89ddec00d4e0fe9fd585d71a67508
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-linux-arm64.tar.gz
        sha256: b6d21e8f9c3b15744f5a7ab40248019157ed7793875dbe0383d4c82ff572b528

  # Lantern itself — Python sources, launcher, desktop entry, metainfo, icon.
  - name: lantern
    buildsystem: simple
    build-commands:
      # Python package
      - cp -r src/lantern /app/share/lantern/lantern

      # Launcher: hardcode the in-sandbox python and sharedir
      - sed -e 's|@PYTHON@|/usr/bin/python3|g'
            -e 's|@SHAREDIR@|/app/share/lantern|g'
            src/lantern.in > lantern.launcher
      - install -Dm755 lantern.launcher /app/bin/lantern

      # Desktop entry: substitute bindir
      - sed 's|@BINDIR@|/app/bin|g' data/nz.ursa.Lantern.desktop.in > nz.ursa.Lantern.desktop
      - install -Dm644 nz.ursa.Lantern.desktop /app/share/applications/nz.ursa.Lantern.desktop

      # MIME type: associates *.lantern.zip (and only that) with Lantern.
      - install -Dm644 data/nz.ursa.Lantern.mime.xml /app/share/mime/packages/nz.ursa.Lantern.xml

      # Metainfo
      - install -Dm644 data/nz.ursa.Lantern.metainfo.xml /app/share/metainfo/nz.ursa.Lantern.metainfo.xml

      # Icon
      - install -Dm644 data/icons/hicolor/scalable/apps/nz.ursa.Lantern.svg
            /app/share/icons/hicolor/scalable/apps/nz.ursa.Lantern.svg

      # IBM Plex Mono (OFL 1.1).  /app/share/fonts is on fontconfig's
      # path inside the GNOME runtime, so dropping TTFs here makes them
      # immediately resolvable as "IBM Plex Mono" — which our CSS asks
      # the editor to use.
      - install -d /app/share/fonts/IBMPlexMono
      - install -m644 data/fonts/IBMPlexMono/*.ttf /app/share/fonts/IBMPlexMono/
      - install -m644 data/fonts/IBMPlexMono/LICENSE.txt /app/share/fonts/IBMPlexMono/LICENSE.txt
    sources:
      - type: dir
        path: ..
